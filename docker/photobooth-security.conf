# The image serves /app as its web root. Keep build and PHP-only paths out of HTTP.
<LocationMatch "(?i)^/(?:bin|config|docker|docs|lib|node_modules|scripts|src|template|test|tests|tools|vendor|var)(?:/|$)">
    Require all denied
</LocationMatch>

<LocationMatch "(?i)^/(?:[^/]+/)*\.[^/]*(?:/|$)">
    Require all denied
</LocationMatch>

<LocationMatch "(?i)^/(?:assets/sass|resources/windows)(?:/|$)">
    Require all denied
</LocationMatch>

# Assets still needed by the kiosk are images, video, sound, fonts and custom CSS.
# Other files under writable volumes, including JSON, PHP, logs and backups,
# must not be returned as static content.
<LocationMatch "(?i)^/(?:data|private)/(?!.*\.(?:jpe?g|png|gif|svg|bmp|webp|avif|heic|mp4|m4v|mov|webm|mp3|ogg|wav|flac|aac|woff2?|ttf|otf|eot|css)$)">
    Require all denied
</LocationMatch>

# Even a JPEG in these directories can contain a capture original or temporary work.
<LocationMatch "(?i)^/data/(?:original|tmp|print|test)(?:/|$)">
    Require all denied
</LocationMatch>

# These source directories are not browser entrypoints; a nested media filename
# must not bypass their protection.
<LocationMatch "(?i)^/private/(?:api|src|sass|collage)(?:/|$)">
    Require all denied
</LocationMatch>

# Keep deployment inputs and helper scripts inaccessible at the document root.
<LocationMatch "(?i)^/(?:Dockerfile|docker-compose\.ya?ml|composer\.(?:json|lock)|package(?:-lock)?\.json|gulpfile\.mjs|eslint\.config\.mjs|README\.md|LICENSE(?:_NOTICE)?|install-[^/]*|setup-[^/]*|start-[^/]*|phpunit\.xml|phpstan\.neon|HEAD)$">
    Require all denied
</LocationMatch>

<LocationMatch "(?i)^/api/[^/]+\.(?:py|sh|ps1)$">
    Require all denied
</LocationMatch>

<Directory "/app">
    Options -Indexes
</Directory>
